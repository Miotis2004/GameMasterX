<div class="password-change" role="main" aria-labelledby="password-heading">
  <h2 id="password-heading">Change Password</h2>

  <div role="status" aria-live="polite" *ngIf="successMessage" class="success">
    <span aria-label="Success">{{ successMessage }}</span>
  </div>
  <div role="alert" aria-live="assertive" *ngIf="errorMessage" class="error">
    <span aria-label="Error">{{ errorMessage }}</span>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="currentPassword">Current Password</label>
      <input id="currentPassword" type="password" formControlName="currentPassword" aria-required="true" [attr.aria-invalid]="form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched" aria-describedby="currentPassword-error" />
      <div id="currentPassword-error" role="alert" *ngIf="getError('currentPassword')">{{ getError('currentPassword') }}</div>
    </div>

    <div class="form-field">
      <label for="newPassword">New Password</label>
      <input id="newPassword" type="password" formControlName="newPassword" aria-required="true" [attr.aria-invalid]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched" aria-describedby="newPassword-error" />
      <div id="newPassword-error" role="alert" *ngIf="getError('newPassword')">{{ getError('newPassword') }}</div>
    </div>

    <div class="form-field">
      <label for="confirmPassword">Confirm New Password</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" aria-required="true" [attr.aria-invalid]="form.get('confirmPassword')?.invalid && form.get('confirmPassword')?.touched" aria-describedby="confirmPassword-error" />
      <div id="confirmPassword-error" role="alert" *ngIf="getError('confirmPassword')">{{ getError('confirmPassword') }}</div>
    </div>

    <button type="submit" [disabled]="form.invalid">Change Password</button>
  </form>
</div>
