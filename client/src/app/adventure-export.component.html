<h2>Adventure Export</h2>
<div *ngIf="loading()">Loading...</div>
<div *ngIf="error()" class="error">{{ error() }}</div>
<div *ngIf="success()" class="success">{{ success() }}</div>
<ul>
  <li *ngFor="let adv of adventures()">
    {{ adv.title }} ({{ adv.id }})
    <button (click)="exportAdventure(adv.id)">Export</button>
  </li>
</ul>
<a routerLink="/adventures">Back to Library</a>
