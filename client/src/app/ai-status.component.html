<section class="ai-status">
  <h2>AI Status</h2>
  <div class="status">
    <span [ngClass]="state">
      AI {{ state }}
    </span>
  </div>
  <button (click)="toggleEnabled()">Toggle Enabled</button>
  <button (click)="toggleAvailability()">Toggle Availability</button>
  <button (click)="clearDegraded()">Clear Degraded</button>
</section>
