<div class="setup-container">
  <h2>First Run Setup</h2>
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" aria-describedby="email-error" [attr.aria-invalid]="form.get('email')?.invalid && form.get('email')?.touched" />
      <div id="email-error" role="alert" *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-message">
        A valid email address is required.
      </div>
    </div>
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password" aria-describedby="password-error" [attr.aria-invalid]="form.get('password')?.invalid && form.get('password')?.touched" />
      <div id="password-error" role="alert" *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-message">
        Password is required and must be at least 8 characters.
      </div>
    </div>
    <button type="submit" [disabled]="loading">Create Admin</button>
  </form>
</div>
