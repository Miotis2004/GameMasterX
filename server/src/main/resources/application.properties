server.port=5172
spring.application.name=game-master-x-server
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/game-master-x}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Reject oversized multipart uploads at the servlet container before they reach
# the application. Must accommodate the adventure import archive limit below.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Local adventure package import limits.
# Maximum size of an uploaded package archive (bytes). Oversized input is
# rejected before any extraction happens.
game.master.x.adventure.import.max-archive-bytes=20971520
# Maximum size of a single entry within a package archive (bytes).
game.master.x.adventure.import.max-entry-bytes=5242880
# Maximum number of entries within a package archive.
game.master.x.adventure.import.max-entries=2000
# Base directory under which package archives are staged during import. Entries
# are confined to this root so a malicious archive path cannot escape it.
game.master.x.adventure.import.staging-dir=./tmp/adventure-imports

# Inventory change limits.
# Maximum number of individual item decrements allowed in a single batch
# decrement request. Excess input is rejected before anything is applied.
game.master.x.inventory.max-batch-changes=100

cors.allowed-origins=http://localhost:5322,http://127.0.0.1:5322
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Optimistic-concurrency commit policy.
# Multi-document commit (aggregate save together with the immutable turn and
# audit history) is only atomic on a MongoDB replica set. When this flag is true
# (the default) a commit whose deployment cannot provide multi-document
# transactions is rejected with a clear diagnostic and no partial commit, rather
# than silently persisting a non-atomic write. Set to false to allow a clearly
# flagged non-transactional fallback on a standalone MongoDB server.
game.master.x.encounter.require-transactional-commit=true

# AI provider abstraction and configuration layer.
# All of these are optional. When no endpoint is configured the application uses
# the bundled OFFLINE local provider and requires no cloud AI provider or
# credentials. Override any value with the matching GAME_MASTER_X_AI_* env var.
# Overall switch for the AI layer.
game.master.x.ai.enabled=false
# External provider endpoint. Blank => offline local provider (no cloud needed).
# When set to a reachable OpenAI-compatible server (Llama.cpp / vLLM / Ollama /
# LM Studio / ...), the configurable OpenAI-compatible adapter
# (AiLocalOpenAiProvider) is used instead. The path /chat/completions is
# appended automatically. If the endpoint is configured but unreachable, the
# adapter degrades gracefully to an offline placeholder instead of failing.
# Example: http://127.0.0.1:8000/v1 (or any OpenAI-compatible base URL).
game.master.x.ai.endpoint=
# Require an external endpoint instead of silently falling back to local.
game.master.x.ai.external-required=false
# Model identity (diagnostic only; never a credential).
game.master.x.ai.model=local-stub
# Name of the environment variable that holds the API key. Only the variable
# NAME is stored here; the value is read server-side and never sent to the
# browser.
game.master.x.ai.api-key-env=GAME_MASTER_X_AI_API_KEY
# Context window size in tokens.
game.master.x.ai.context-size=4096
# Hard cap on output tokens per completion (generation limit).
game.master.x.ai.max-tokens=512
# Per-generation timeout (ISO-8601 duration, e.g. 15s, 2m).
game.master.x.ai.timeout=15s
# Cancellation controls for in-flight completions.
game.master.x.ai.cancellation.enabled=true
game.master.x.ai.cancellation.poll-interval=100ms
# Health check controls.
game.master.x.ai.health.enabled=true
game.master.x.ai.health.fail-when-unavailable=false

# AI narration context-assembly configuration.
# All of these are optional; the defaults keep the assembled player-visible
# context within the AI provider's context window and gated behind the PLAYER
# role. Override any value with the matching GAME_MASTER_X_NARRATION_* env var.
# Minimum membership role required to assemble a narration context. The context
# is gated by backend authorization; any value below PLAYER would let a passive
# observer drive an AI completion.
game.master.x.narration.required-role=PLAYER
# Hard cap, in UTF-8 bytes, on the player-visible context sent to the AI. GM
# only secrets are kept in a separate partition and are never sent to the AI.
game.master.x.narration.max-context-bytes=3072
# Hard cap, in lines, on the player-visible context sent to the AI.
game.master.x.narration.max-context-lines=96
# Number of recent turns drawn from the immutable audit history when assembling
# the recent narrative. Non-positive values disable recent-narrative inclusion.
game.master.x.narration.recent-narrative-turns=8
# Whether the assembled player-visible context may be truncated to respect the
# byte/line budget. When false an over-budget context is rejected.
game.master.x.narration.allow-truncation=true
# Maximum number of world facts and objectives pulled from the adventure.
game.master.x.narration.max-world-facts=12
game.master.x.narration.max-objectives=12

# Map asset upload limits
# Maximum size of an uploaded map asset file (bytes)
game.master.x.map.asset.max-bytes=10485760
# Base directory under which map assets are stored
game.master.x.map.asset.upload-dir=./uploads/maps
# Comma-separated list of allowed MIME types
game.master.x.map.asset.allowed-types=image/png,image/jpeg,image/webp,image/gif
