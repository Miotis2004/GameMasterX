server.port=5172
spring.application.name=game-master-x-server
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/game-master-x}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Reject oversized multipart uploads at the servlet container before they reach
# the application. Must accommodate the adventure import archive limit below.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Local adventure package import limits.
# Maximum size of an uploaded package archive (bytes). Oversized input is
# rejected before any extraction happens.
game.master.x.adventure.import.max-archive-bytes=20971520
# Maximum size of a single entry within a package archive (bytes).
game.master.x.adventure.import.max-entry-bytes=5242880
# Maximum number of entries within a package archive.
game.master.x.adventure.import.max-entries=2000
# Base directory under which package archives are staged during import. Entries
# are confined to this root so a malicious archive path cannot escape it.
game.master.x.adventure.import.staging-dir=./tmp/adventure-imports

cors.allowed-origins=
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=
cors.allow-credentials=false
